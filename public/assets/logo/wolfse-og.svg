<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="WOLFSE — Metalde Keskin Güç">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3d00"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <radialGradient id="lazerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff3d00" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Arka plan -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid overlay (ince) -->
  <g stroke="#1a2332" stroke-width="0.5" opacity="0.2">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200 M0 480 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>
  
  <!-- Ateş/ışık efekti (sağ taraf) -->
  <line x1="1050" y1="-50" x2="1200" y2="680" stroke="url(#fireGrad)" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
  <line x1="1000" y1="-30" x2="1150" y2="700" stroke="#ff5a1f" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  
  <!-- Kurt başı mark (büyütülmüş) -->
  <g transform="translate(140, 130) scale(3.5)" filter="url(#shadow)">
    <!-- Kurt başı arka şekli -->
    <path d="M 24 38 L 30 22 L 38 24 L 44 14 L 52 24 L 60 22 L 66 38 Q 70 48 66 60 Q 62 68 44 72 Q 26 68 22 60 Q 18 48 24 38 Z" fill="#1a2332" stroke="#2a3854" stroke-width="2"/>
    
    <!-- Kulaçlar (keskin) -->
    <path d="M 28 28 L 24 8 L 34 22 Z" fill="#2a3854"/>
    <path d="M 60 28 L 64 8 L 54 22 Z" fill="#2a3854"/>
    
    <!-- Kulaç tepeleri (altın) -->
    <path d="M 28 28 L 26 12 L 30 24 Z" fill="#ff9100" opacity="0.8"/>
    <path d="M 60 28 L 62 12 L 58 24 Z" fill="#ff9100" opacity="0.8"/>
    
    <!-- Burun -->
    <path d="M 40 52 L 44 58 L 48 52 Z" fill="#0a0c10"/>
    
    <!-- Lazer gözleri -->
    <circle cx="34" cy="42" r="7" fill="#ff3d00" filter="url(#glow)"/>
    <circle cx="54" cy="42" r="7" fill="#ff3d00" filter="url(#glow)"/>
    
    <!-- Göz iç parıltı -->
    <circle cx="34" cy="40" r="3" fill="#ffdd00" opacity="0.9"/>
    <circle cx="54" cy="40" r="3" fill="#ffdd00" opacity="0.9"/>
    
    <!-- Lazer ışını -->
    <line x1="34" y1="35" x2="34" y2="0" stroke="#ff5a1f" stroke-width="4" opacity="0.7"/>
    <line x1="54" y1="35" x2="54" y2="0" stroke="#ff5a1f" stroke-width="4" opacity="0.7"/>
    
    <!-- Aura -->
    <circle cx="34" cy="42" r="12" fill="url(#lazerGlow)"/>
    <circle cx="54" cy="42" r="12" fill="url(#lazerGlow)"/>
  </g>
  
  <!-- WOLFSE Ana Yazısı -->
  <text x="520" y="330" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" letter-spacing="6" fill="#ffffff" filter="url(#shadow)">WOLF<tspan fill="#ff3d00">SE</tspan></text>
  
  <!-- METALDE KESKİN GÜÇ -->
  <text x="520" y="410" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="4" fill="#ff5a1f">METALDE KESKİN GÜÇ</text>
  
  <!-- Altlık yazı -->
  <text x="520" y="480" font-family="Arial, Helvetica, sans-serif" font-size="32" letter-spacing="2" fill="#8a9aa8">CNC Lazer Kesim · Abkant Büküm · Kaynaklı İmalat · Fason Üretim</text>
  
  <!-- Dekoratif çizgiler -->
  <line x1="520" y1="500" x2="950" y2="500" stroke="#ff3d00" stroke-width="3" opacity="0.7"/>
  <line x1="520" y1="510" x2="850" y2="510" stroke="#ff5a1f" stroke-width="1.5" opacity="0.4"/>
</svg>
